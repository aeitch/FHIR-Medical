name: CI & Governance Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and dependencies
        run: |
          pip install uv
          cd backend
          uv venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: |
          cd backend
          . .venv/bin/activate
          ruff check .

      - name: Run Pytest
        run: |
          cd backend
          . .venv/bin/activate
          pytest -v

  frontend:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Type check (tsc)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  terraform:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: |
          cd terraform/environments/demo
          terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd terraform/environments/demo
          terraform init -backend=false
          terraform validate

  file-cap-gate:
    name: Hard 800-Line File Cap Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce 800-Line File Cap
        run: |
          echo "Checking all source files for <= 800 lines rule..."
          FAIL=0
          while IFS= read -r file; do
            LINES=$(wc -l < "$file")
            if [ "$LINES" -gt 800 ]; then
              echo "FAIL: $file exceeds 800 lines ($LINES lines)"
              FAIL=1
            fi
          done < <(find backend frontend terraform -type f \( -name "*.py" -o -name "*.ts" -o -name "*.tsx" -o -name "*.tf" \) 2>/dev/null)
          if [ "$FAIL" -eq 1 ]; then
            echo "One or more files exceeded the 800-line cap. Please modularize."
            exit 1
          fi
          echo "All source files comply with the 800-line rule."
