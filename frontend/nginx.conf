server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable all browser/proxy caching for HTML & API
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location /api/ {
        proxy_pass https://clinefficiency-backend-256461781819.us-central1.run.app/api/;
        proxy_set_header Host clinefficiency-backend-256461781819.us-central1.run.app;
        proxy_ssl_server_name on;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /health {
        proxy_pass https://clinefficiency-backend-256461781819.us-central1.run.app/health;
        proxy_set_header Host clinefficiency-backend-256461781819.us-central1.run.app;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
